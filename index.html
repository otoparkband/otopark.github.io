<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>otopark</title>
<meta name="description" content="Songs, Sessions und Konzerte von otopark.">
<meta name="theme-color" content="#536472">
<meta property="og:type" content="website">
<meta property="og:title" content="otopark">
<meta property="og:description" content="Songs, Sessions und Konzerte von otopark.">
<!-- Vorschaubild für Instagram/WhatsApp, 1200×630 px, später eintragen:
<meta property="og:image" content="https://DEINE-DOMAIN.de/og.jpg"> -->
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="logo.webp" as="image">
<style>
/* Schriften liegen lokal in fonts/ – kein Abruf bei Google (DSGVO). Alle unter SIL Open Font License. */
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono.woff2) format("woff2");font-weight:100 800;font-display:swap}

/* Schrift: JetBrains Mono – Strichstärke normal / beim Drüberfahren, Laufweite */
html{--f:"JetBrains Mono";--w:200;--wh:500;--ls:-.04em}

:root{
  --bg:#536472;             /* Hintergrund rgb(83,100,114) */
  --title:#e0f2f8;          /* Schrift „otopark“ rgb(224,242,248) */
  --c:#b3c4ff;              /* aktuelle Logofarbe, wechselt an jeder Kante */
  --lc:#ffa69c;             /* aktuelle Linkfarbe, immer anders als das Logo */
  --pad:clamp(4px,1vw,12px);   /* Abstand links/rechts */
  --vpad:clamp(10px,1.5vw,20px);
  --rule:3px;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--title);
  font-family:var(--f),ui-monospace,Menlo,monospace;font-weight:var(--w);font-size:18px;line-height:1.35;
  -webkit-font-smoothing:antialiased;text-transform:lowercase}

@property --pop{syntax:'<number>';inherits:false;initial-value:1}
/* Bildschirmschoner-Ebene: liegt über der Schrift, Klicks gehen durch */
.screen{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.dvd{position:absolute;top:0;left:0;width:calc(clamp(220px,46vw,520px) * var(--s,1));aspect-ratio:900/385;
  pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background-color:var(--c);
  -webkit-mask:url(logo.webp) center/contain no-repeat;mask:url(logo.webp) center/contain no-repeat;
  will-change:transform;transform:translate3d(var(--x,0px),var(--y,0px),0) scale(var(--pop,1))}

.page{position:relative;z-index:1;display:flex;flex-direction:column;min-height:calc(100vh + 5rem);min-height:calc(100svh + 5rem);
  padding:calc(var(--vpad) + env(safe-area-inset-top)) var(--pad) calc(var(--vpad) + env(safe-area-inset-bottom))}

.name{margin:0 0 calc(.16em + var(--vpad)) -.063em;color:var(--title);font-weight:var(--w);letter-spacing:calc(var(--ls) - .02em);text-align:left;
  font-size:calc((100vw - 2 * var(--pad)) / 3.6);line-height:.86;white-space:nowrap}

/* Linien gehen von Rand zu Rand, Text startet fast ganz links, alle Links in einer Farbe */
.links{margin:0 calc(-1 * var(--pad));border-top:var(--rule) solid var(--title)}
.link{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:.2em var(--pad);border-bottom:var(--rule) solid var(--title);color:var(--lc);text-decoration:none;
  font-weight:var(--w);font-size:clamp(28px,8vw,80px);line-height:1.08;letter-spacing:var(--ls);
  -webkit-tap-highlight-color:transparent}

.link:focus-visible{outline:3px solid var(--title);outline-offset:-6px}
.txt{min-width:0;margin-left:-.05em}   /* gleicht den Leerraum vor dem ersten Buchstaben aus */
.sub{display:block;margin:.15em 0 .2em;color:var(--title);font-size:max(15px,.19em);font-weight:var(--w);letter-spacing:-.02em;line-height:1.2}
/* kleines Bild rechts neben dem Titel (optional) */
.thumb{flex:none;display:block;width:1.8em;height:1.8em;object-fit:cover}

.foot{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:auto;padding-top:25vh;font-size:12px}  /* Abstand: Impressum/Datenschutz erst nach Scrollen */
.foot a{color:var(--title);text-underline-offset:2px;text-decoration-thickness:1px}

.foot a:focus-visible{outline:3px solid var(--title);outline-offset:3px}
.foot .copy{margin-left:auto}

/* Invertierte Farben, wenn ein Logo eine Ecke trifft */
.flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:#fff;mix-blend-mode:difference;opacity:0}
html.corner .flash{opacity:1}


</style>
</head>
<body>
<div class="screen" aria-hidden="true"><div class="dvd"></div></div>
<div class="flash" aria-hidden="true"></div>

<main class="page">
  <h1 class="name">otopark</h1>

  <!--
    LINKS BEARBEITEN
    - href = Ziel, Text = was angezeigt wird.
    - Bild rechts (optional): vor </a> einfügen
        <img class="thumb" src="bilder/DATEINAME.jpg" alt="" width="240" height="240">
      Das Bild wird quadratisch zugeschnitten. Ideal: ca. 240 × 240 Pixel, JPG oder WebP, im Ordner bilder/.
      Ohne Bild die Zeile einfach weglassen.
  -->
  <nav class="links" aria-label="Links von otopark">
    <a class="link" href="https://open.spotify.com/track/3tSlEqcOaCvUDscZmn88me">
      <span class="txt">jeanny<span class="sub">listen to jeanny on spotify</span></span>
      <img class="thumb" src="bilder/jeanny.webp" alt="" width="240" height="240">
    </a>
    <a class="link" href="https://open.spotify.com/track/355EsjNYit31ARsVx7t9a2">
      <span class="txt">sonication<span class="sub">listen to sonication on spotify</span></span>
      <img class="thumb" src="bilder/sonication.webp" alt="" width="240" height="240">
    </a>
    <a class="link" href="https://www.youtube.com/watch?v=hRSg6Cju1nY">
      <span class="txt">overflow @ einmal sessions<span class="sub">watch our performance of overflow on einmal sessions</span></span>
    </a>
    <a class="link" href="https://open.spotify.com/artist/43H27aw5Zb7nONSRCdYGzO"><span class="txt">spotify</span></a>
    <a class="link" href="https://music.apple.com/de/artist/otopark/1814825149"><span class="txt">apple music</span></a>
    <a class="link" href="https://otopark.bandcamp.com/album/sonication"><span class="txt">bandcamp</span></a>
    <a class="link" href="https://www.instagram.com/otopark__/"><span class="txt">instagram</span></a>
  </nav>

  <footer class="foot">
    <span class="copy">© 2026 otopark</span>
  </footer>
</main>


<script>
/* Überschrift auf Seitenbreite skalieren (am Desktop höchstens 42 % der Fensterhöhe) und alle Texte
   so ausrichten, dass der erste Buchstabe genau am linken Rand beginnt */
(() => {
  const name = document.querySelector('.name');
  const titles = [...document.querySelectorAll('.link .txt')];
  const cx = document.createElement('canvas').getContext('2d');
  const lead = (el, ch) => {              // Leerraum vor dem Buchstaben, in em
    const cs = getComputedStyle(el);
    cx.font = `${cs.fontWeight} 1000px ${cs.fontFamily}`;
    return Math.max(0, -cx.measureText(ch).actualBoundingBoxLeft / 1000);
  };
  const run = () => {
    const nl = lead(name, (name.textContent.trim()[0] || 'o'));
    name.style.marginLeft = '0px';
    name.style.fontSize = '100px';
    const r = document.createRange(); r.selectNodeContents(name);
    const em = r.getBoundingClientRect().width / 100;            // Breite in em
    const avail = name.clientWidth;
    if (em > 0) {
      const size = Math.min(avail / (em - nl) * 0.9, innerHeight * 0.38);   // 90 % der Breite, links ausgerichtet
      name.style.fontSize = size + 'px';
      name.style.marginLeft = `calc(${-nl}em - var(--pad) + 1px)`;   // erster Buchstabe 1 px vom Bildschirmrand
    }
    titles.forEach(t => {
      const first = ((t.firstChild && t.firstChild.textContent.trim()[0]) || 'o').toLowerCase();
      t.style.marginLeft = (-lead(t, first)) + 'em';
    });
  };
  window.refit = run;
  addEventListener('resize', run);
  if (document.fonts) document.fonts.ready.then(run);
  run();
})();

/* Logo im Stil des DVD-Bildschirmschoners.
   - An jeder Kante bekommt das Logo eine neue Farbe, die Links eine andere.
   - Klick/Tipp aufs Logo: es teilt sich in zwei kleinere Logos, die auseinanderfliegen. */
(() => {
  'use strict';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const screen = document.querySelector('.screen');
  const first = document.querySelector('.dvd');
  const root = document.documentElement;

  /* Farben an jeder Kante. Alle sind auf dem Graublau als große Schrift gut lesbar (Kontrast ≥ 3:1). */
  const COLORS = ['#ffa69c', '#b3c4ff', '#7dffb0', '#ffa8de', '#d2b6ff', '#ffc078', '#7fe3ff', '#ffe066', '#e0f2f8'];
  const SHRINK = 0.72;        // jedes neue Logo ist so viel kleiner
  const MIN_WIDTH = 44;       // kleiner wird nicht geteilt (Pixel)
  const MAX_LOGOS = 64;
  const pick = (...not) => {
    let c;
    do { c = COLORS[Math.floor(Math.random() * COLORS.length)]; } while (not.includes(c));
    return c;
  };
  let linkColor = '', lastLink = 0;
  function recolorLinks(logoColor) {
    const now = performance.now();
    if (now - lastLink < 250 && linkColor !== logoColor) return;   // bei vielen Logos nicht zu hektisch
    lastLink = now;
    linkColor = pick(logoColor, linkColor);
    root.style.setProperty('--lc', linkColor);
  }

  let W = 0, H = 0, speed = 100;
  const logos = [];
  function setColor(L, c) { L.color = c; L.el.style.setProperty('--c', c); }
  function size(L) { L.w = L.el.offsetWidth; L.h = L.el.offsetHeight; }
  function place(L) {
    L.el.style.setProperty('--x', L.x.toFixed(1) + 'px');
    L.el.style.setProperty('--y', L.y.toFixed(1) + 'px');
  }
  function clamp(L) {
    L.x = Math.min(Math.max(0, L.x), Math.max(0, W - L.w));
    L.y = Math.min(Math.max(0, L.y), Math.max(0, H - L.h));
  }
  function measure() {
    W = screen.clientWidth; H = screen.clientHeight;
    speed = Math.max(70, Math.min(140, Math.hypot(W, H) * 0.08));   // Pixel pro Sekunde
    logos.forEach(L => { size(L); clamp(L); place(L); });
  }

  const start = { el: first, s: 1, x: 0, y: 0, vx: 1, vy: 1, color: '' };
  logos.push(start);
  setColor(start, pick('#e0f2f8'));
  recolorLinks(start.color);
  measure();

  if (reduce) {                          // Bewegung reduzieren: Logo steht still am rechten Rand
    first.style.pointerEvents = 'none';
    const park = () => { measure(); start.x = Math.max(0, W - start.w - 16); start.y = Math.max(0, (H - start.h) * 0.62); place(start); };
    park(); addEventListener('resize', park);
    return;
  }

  start.x = Math.random() * Math.max(1, W - start.w);
  start.y = Math.random() * Math.max(1, H - start.h);
  start.vx = Math.random() < .5 ? -1 : 1;
  start.vy = Math.random() < .5 ? -1 : 1;
  place(start);

  function split(L) {
    const s = L.s * SHRINK;
    const cx = L.x + L.w / 2, cy = L.y + L.h / 2;
    if (L.w * SHRINK < MIN_WIDTH || logos.length >= MAX_LOGOS) {   // zu klein: nur kurz aufblitzen
      setColor(L, pick(L.color)); pop(L.el); return;
    }
    L.s = s; L.el.style.setProperty('--s', s); size(L);
    const el = L.el.cloneNode(false);
    screen.appendChild(el);
    L.vx = Math.random() < .5 ? -1 : 1;                 // zufällige Schräge für das alte Logo …
    L.vy = Math.random() < .5 ? -1 : 1;
    const twin = { el, s, x: 0, y: 0, vx: -L.vx, vy: -L.vy, color: '' };   // … das neue fliegt genau entgegengesetzt
    el.style.setProperty('--s', s);
    logos.push(twin); size(twin);
    L.x = cx - L.w / 2; L.y = cy - L.h / 2;
    twin.x = L.x; twin.y = L.y;
    setColor(twin, pick(L.color));
    clamp(L); clamp(twin); place(L); place(twin);
    pop(L.el); pop(el);
    el.addEventListener('pointerdown', onTap);
  }
  function pop(el) {
    el.animate([{ '--pop': 1.25 }, { '--pop': 1 }], { duration: 260, easing: 'cubic-bezier(.2,.9,.3,1.4)' });
  }
  function onTap(e) {
    const L = logos.find(l => l.el === e.currentTarget);
    if (L) { e.preventDefault(); split(L); }
  }
  first.addEventListener('pointerdown', onTap);

  /* Trifft ein Logo (fast) genau eine Ecke, werden alle Farben invertiert –
     bis zur nächsten Kantenberührung, mindestens aber 5 Sekunden */
  const CORNER_TOLERANCE = 30, INVERT_MIN_MS = 5000;   // Toleranz in Pixeln, Mindestdauer in ms
  let invertedAt = 0, undoTimer = 0;
  function edgeHit(isCorner) {
    if (isCorner) {
      clearTimeout(undoTimer); undoTimer = 0;
      invertedAt = performance.now();
      root.classList.add('corner');
    } else if (root.classList.contains('corner') && !undoTimer) {
      const wait = INVERT_MIN_MS - (performance.now() - invertedAt);
      undoTimer = setTimeout(() => { root.classList.remove('corner'); undoTimer = 0; }, Math.max(0, wait));
    }
  }

  let last = 0;
  function frame(t) {
    const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
    last = t;
    for (const L of logos) {
      const step = speed * dt * Math.SQRT1_2 * (0.85 + 0.15 / L.s) ;   // kleine Logos etwas schneller
      L.x += L.vx * step; L.y += L.vy * step;
      let hitX = false, hitY = false;
      const maxX = Math.max(0, W - L.w), maxY = Math.max(0, H - L.h);
      if (L.x <= 0) { L.x = 0; L.vx = 1; hitX = true; } else if (L.x >= maxX) { L.x = maxX; L.vx = -1; hitX = true; }
      if (L.y <= 0) { L.y = 0; L.vy = 1; hitY = true; } else if (L.y >= maxY) { L.y = maxY; L.vy = -1; hitY = true; }
      if (hitX || hitY) {
        setColor(L, pick(L.color));
        recolorLinks(L.color);
        const nearX = L.x < CORNER_TOLERANCE || L.x > maxX - CORNER_TOLERANCE;
        const nearY = L.y < CORNER_TOLERANCE || L.y > maxY - CORNER_TOLERANCE;
        edgeHit(nearX && nearY);
      }
      place(L);
    }
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = 0; });
  addEventListener('resize', measure);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
