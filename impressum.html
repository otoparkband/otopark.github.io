@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono.woff2) format("woff2");font-weight:100 800;font-display:swap}
body{margin:0;background:#536472;color:#fff;font:400 17px/1.5 "JetBrains Mono","Helvetica Neue",Arial,sans-serif}
main{padding:clamp(8px,1.5vw,20px);max-width:720px}
h1{font-weight:200;color:#e0f2f8;font-size:clamp(48px,14vw,120px);line-height:.9;letter-spacing:-.05em;margin:24px 0 28px}

p{margin:0 0 10px}

<body>
<main>
  <p><a href="./">Zurück zu den Links</a></p>
  <h1>Impressum</h1>

  <!-- Angaben gemäß § 5 DDG. Platzhalter in [eckigen Klammern] ersetzen.
       Bei einer Band als GbR: alle Mitglieder oder die vertretungsberechtigte Person nennen. -->
  <h2>Angaben gemäß § 5 DDG</h2>
  <p>[Vorname Nachname bzw. „otopark GbR, vertreten durch …“]<br>
     [Straße Hausnummer]<br>
     [PLZ Ort]</p>

  <h2>Kontakt</h2>
  <p>E-Mail: <a href="mailto:booking@example.com">[booking@example.com]</a><br>
     Telefon: [optional]</p>
